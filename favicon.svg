<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="t-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" /> <!-- Verde/Teal vibrante -->
      <stop offset="100%" stop-color="#059669" /> <!-- Verde esmeralda oscuro -->
    </linearGradient>
  </defs>
  
  <!-- Fondo redondeado oscuro -->
  <rect width="100" height="100" rx="24" fill="#18181B" />
  
  <!-- Barra superior de la 'T' -->
  <rect x="24" y="28" width="52" height="14" rx="5" fill="url(#t-grad)" />
  
  <!-- Tronco de la 'T' -->
  <rect x="43" y="46" width="14" height="30" rx="5" fill="url(#t-grad)" />
  
  <!-- Punto dorado (moneda / meta / ahorro) -->
  <circle cx="69" cy="69" r="7" fill="#F59E0B" />
</svg>
